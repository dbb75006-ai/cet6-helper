<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>CET-6 英语学习助手</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="六级助手">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#475569}

:root{
  --c-text: #f1f5f9;
  --c-text2: #cbd5e1;
  --c-muted: #94a3b8;
  --c-dim: #64748b;
  --c-faint: #475569;
  --c-accent: #38bdf8;
  --c-green: #5eead4;
  --c-bg-deep: #0f172a;
  --c-tag-bg: #1e3a5f;
}
[data-theme="light"]{
  --c-text: #1e293b;
  --c-text2: #475569;
  --c-muted: #64748b;
  --c-dim: #64748b;
  --c-faint: #94a3b8;
  --c-accent: #0284c7;
  --c-green: #0d9488;
  --c-bg-deep: #f1f5f9;
  --c-tag-bg: rgba(2,132,199,.1);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,#0b1120 0%,#0f172a 30%,#111827 100%);
  color:#e2e8f0;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;top:-40%;right:-20%;width:800px;height:800px;
  background:radial-gradient(circle,rgba(56,189,248,.06) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:-30%;left:-15%;width:600px;height:600px;
  background:radial-gradient(circle,rgba(94,234,212,.04) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:24px 20px}

header{text-align:center;padding:36px 0 24px}
header h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8 0%,#818cf8 50%,#5eead4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
header p{color:var(--c-dim);margin-top:8px;font-size:.9rem;letter-spacing:.5px}

/* ── Stats Bar ── */
.stats-bar{display:flex;gap:10px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.stat-card{
  background:linear-gradient(135deg,rgba(30,41,59,.8),rgba(15,23,42,.6));
  border:1px solid rgba(51,65,85,.5);border-radius:14px;padding:14px 22px;
  text-align:center;min-width:95px;backdrop-filter:blur(8px);
  transition:all .3s;cursor:default;
}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.4);box-shadow:0 4px 20px rgba(56,189,248,.1)}
.stat-card .num{font-size:1.5rem;font-weight:800;color:var(--c-accent);line-height:1.2}
.stat-card .label{font-size:.72rem;color:var(--c-muted);margin-top:4px;letter-spacing:.5px}

/* ── Navigation ── */
nav{display:flex;gap:4px;background:rgba(30,41,59,.6);backdrop-filter:blur(12px);border:1px solid rgba(51,65,85,.4);border-radius:16px;padding:5px;margin-bottom:28px;flex-wrap:wrap}
nav button{
  flex:1;min-width:75px;padding:11px 8px;border:none;background:transparent;
  color:var(--c-muted);border-radius:12px;cursor:pointer;font-size:.82rem;font-weight:500;
  transition:all .25s;white-space:nowrap;position:relative;
}
nav button:hover{color:#e2e8f0;background:rgba(51,65,85,.4)}
nav button.active{background:rgba(56,189,248,.15);color:var(--c-accent);font-weight:600;box-shadow:0 0 12px rgba(56,189,248,.1)}

.view{display:none;animation:fadeSlide .3s}
.view.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Flashcard ── */
.flashcard-wrap{perspective:1200px;width:100%;max-width:500px;margin:30px auto}
.flashcard{
  width:100%;height:300px;position:relative;cursor:pointer;
  transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;
}
.flashcard:hover .front,.flashcard:hover .back{box-shadow:0 8px 40px rgba(56,189,248,.12)}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard .front,.flashcard .back{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px;text-align:center;transition:box-shadow .3s;
}
.flashcard .front{
  background:linear-gradient(145deg,#1a2740 0%,#1e3a5f 100%);
  border:1px solid rgba(56,189,248,.2);
}
.flashcard .back{
  background:linear-gradient(145deg,#142a2a 0%,#1a3d3a 100%);
  border:1px solid rgba(94,234,212,.2);transform:rotateY(180deg);
}
.flashcard .word{font-size:2.4rem;font-weight:800;color:#f1f5f9;letter-spacing:1px}
.flashcard .phonetic{color:#38bdf8;font-size:1.05rem;margin-top:6px;font-weight:400;letter-spacing:.5px;min-height:1.5em}
.flashcard .pos{color:var(--c-muted);font-size:.82rem;margin-top:4px;padding:3px 12px;background:rgba(56,189,248,.1);border-radius:20px}
.flashcard .meaning{font-size:1.4rem;color:var(--c-green);font-weight:700}
.flashcard .phonetic-back{color:#38bdf8;font-size:.95rem;margin-top:8px;letter-spacing:.5px;min-height:1.2em}
.flashcard .example{color:var(--c-muted);margin-top:12px;font-size:.9rem;font-style:italic;line-height:1.5}
.flashcard .hint{color:var(--c-faint);font-size:.75rem;margin-top:24px}

/* ── Buttons ── */
.card-controls{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.btn{
  padding:10px 22px;border:none;border-radius:10px;cursor:pointer;
  font-size:.85rem;font-weight:600;transition:all .25s;color:#fff;
  letter-spacing:.3px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.btn:active{transform:translateY(0)}
.btn-blue{background:linear-gradient(135deg,#2563eb,#3b82f6)}.btn-blue:hover{background:linear-gradient(135deg,#1d4ed8,#2563eb);box-shadow:0 4px 20px rgba(37,99,235,.35)}
.btn-green{background:linear-gradient(135deg,#059669,#10b981)}.btn-green:hover{background:linear-gradient(135deg,#047857,#059669);box-shadow:0 4px 20px rgba(5,150,105,.35)}
.btn-red{background:linear-gradient(135deg,#dc2626,#ef4444)}.btn-red:hover{background:linear-gradient(135deg,#b91c1c,#dc2626);box-shadow:0 4px 20px rgba(220,38,38,.35)}
.btn-gray{background:rgba(51,65,85,.8);color:#e2e8f0;border:1px solid rgba(71,85,105,.4)}.btn-gray:hover{background:#475569;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.btn-purple:hover{background:linear-gradient(135deg,#6d28d9,#7c3aed);box-shadow:0 4px 20px rgba(124,58,237,.35)}

/* ── Quiz ── */
.quiz-wrap{max-width:560px;margin:0 auto}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:var(--c-muted);font-size:.85rem}
.quiz-progress .bar-wrap{flex:1;height:8px;background:rgba(51,65,85,.5);border-radius:4px;margin:0 16px;overflow:hidden}
.quiz-progress .bar-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#818cf8);border-radius:4px;transition:width .4s}
.quiz-question{background:linear-gradient(145deg,rgba(30,41,59,.8),rgba(15,23,42,.6));border:1px solid rgba(56,189,248,.15);border-radius:18px;padding:44px 32px;text-align:center;margin-bottom:24px;backdrop-filter:blur(8px)}
.quiz-question .q-label{color:var(--c-dim);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
.quiz-question .q-word{font-size:1.9rem;color:var(--c-green);font-weight:700;margin-top:12px;line-height:1.4}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz-option{padding:18px;background:rgba(30,41,59,.6);border:2px solid rgba(51,65,85,.5);border-radius:14px;color:#e2e8f0;cursor:pointer;font-size:.95rem;transition:all .2s;text-align:center;backdrop-filter:blur(4px)}
.quiz-option:hover{border-color:var(--c-accent);background:rgba(30,58,95,.5);transform:translateY(-1px);box-shadow:0 4px 16px rgba(56,189,248,.1)}
.quiz-option.correct{border-color:#10b981;background:rgba(6,78,59,.6);color:var(--c-green);box-shadow:0 0 20px rgba(5,150,105,.2)}
.quiz-option.wrong{border-color:#ef4444;background:rgba(69,10,10,.6);color:#fca5a5;box-shadow:0 0 20px rgba(220,38,38,.2)}
.quiz-result{text-align:center;padding:36px;background:linear-gradient(145deg,rgba(30,41,59,.8),rgba(15,23,42,.6));border:1px solid rgba(51,65,85,.4);border-radius:18px;margin-top:24px;backdrop-filter:blur(8px)}
.quiz-result .score{font-size:3.2rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#5eead4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── Tables ── */
.list-controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:12px 18px;background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.5);border-radius:10px;color:#e2e8f0;font-size:.9rem;outline:none;transition:all .25s;backdrop-filter:blur(4px)}
.search-input:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(56,189,248,.1)}
.search-input::placeholder{color:var(--c-dim)}
.filter-select{padding:10px 16px;background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.5);border-radius:10px;color:#e2e8f0;font-size:.9rem;outline:none;cursor:pointer;transition:all .25s}
.filter-select:focus{border-color:var(--c-accent)}
.word-table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden}
.word-table th{text-align:left;padding:12px 16px;background:rgba(30,41,59,.8);color:var(--c-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(51,65,85,.4);position:sticky;top:0;backdrop-filter:blur(8px)}
.word-table td{padding:13px 16px;border-bottom:1px solid rgba(30,41,59,.5);font-size:.9rem;transition:background .2s}
.word-table tbody tr{transition:all .2s}
.word-table tbody tr:hover{background:rgba(56,189,248,.04)}
.word-table .en{color:#f1f5f9;font-weight:600}
.word-table .zh{color:var(--c-green)}
.word-table .ex-td{color:var(--c-muted);font-size:.8rem;font-style:italic}
.status-btn{padding:5px 14px;border:1px solid rgba(51,65,85,.5);border-radius:20px;background:transparent;color:var(--c-muted);cursor:pointer;font-size:.75rem;font-weight:500;transition:all .25s}
.status-btn:hover{border-color:var(--c-accent);color:#f1f5f9}
.status-btn.known{background:rgba(5,150,105,.15);border-color:#10b981;color:var(--c-green)}
.status-btn.known:hover{background:rgba(5,150,105,.25)}

/* ── News ── */
.news-source-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.news-source-btn{padding:9px 18px;border:1px solid rgba(51,65,85,.5);border-radius:10px;background:rgba(30,41,59,.4);color:var(--c-muted);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .25s;backdrop-filter:blur(4px)}
.news-source-btn:hover{color:#e2e8f0;border-color:rgba(56,189,248,.5);background:rgba(30,58,95,.4)}
.news-source-btn.active{background:rgba(56,189,248,.15);border-color:var(--c-accent);color:var(--c-accent);box-shadow:0 0 12px rgba(56,189,248,.1)}
.news-card{
  background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.5));
  border:1px solid rgba(51,65,85,.4);border-radius:14px;padding:20px 24px;
  margin-bottom:12px;cursor:pointer;transition:all .3s;backdrop-filter:blur(4px);
  position:relative;overflow:hidden;
}
.news-card::after{
  content:'';position:absolute;left:0;top:0;width:3px;height:100%;
  background:linear-gradient(180deg,#38bdf8,#5eead4);
  opacity:0;transition:opacity .3s;
}
.news-card:hover{border-color:rgba(56,189,248,.4);transform:translateX(4px);box-shadow:0 4px 24px rgba(56,189,248,.1)}
.news-card:hover::after{opacity:1}
.news-card .news-title{font-size:1.05rem;font-weight:700;color:#f1f5f9;margin-bottom:6px;line-height:1.4}
.news-card .news-meta{font-size:.74rem;color:var(--c-dim)}
.news-card .news-desc{font-size:.85rem;color:var(--c-muted);line-height:1.6;margin-top:8px}
.news-card .news-source{display:inline-block;padding:3px 10px;background:rgba(56,189,248,.1);border-radius:20px;font-size:.7rem;color:var(--c-accent);font-weight:600;margin-right:8px;letter-spacing:.3px}
.news-loading{text-align:center;padding:40px;color:var(--c-dim)}

/* ── CET6 Practice ── */
.practice-tabs{display:flex;gap:4px;background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.4);border-radius:14px;padding:5px;margin-bottom:24px;backdrop-filter:blur(8px);flex-wrap:wrap}
.practice-tabs button{flex:1;padding:11px 8px;border:none;background:transparent;color:var(--c-muted);border-radius:10px;cursor:pointer;font-size:.84rem;font-weight:500;transition:all .25s;white-space:nowrap}
.practice-tabs button:hover{color:#e2e8f0;background:rgba(51,65,85,.3)}
.practice-tabs button.active{background:rgba(56,189,248,.15);color:var(--c-accent);font-weight:600;box-shadow:0 0 10px rgba(56,189,248,.08)}
.practice-subview{display:none}
.practice-subview.active{display:block;animation:fadeSlide .25s}

.passage-card{background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.5));border:1px solid rgba(51,65,85,.4);border-radius:16px;padding:28px;margin-bottom:20px;backdrop-filter:blur(4px)}
.passage-card .passage-title{color:var(--c-accent);font-weight:700;font-size:1.05rem;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(51,65,85,.4)}
.passage-card .passage-text{color:var(--c-text2);line-height:2;margin-bottom:24px;font-size:.93rem}
.passage-card .passage-text .highlight{background:rgba(56,189,248,.12);padding:1px 7px;border-radius:4px;color:var(--c-accent);font-weight:500}
.passage-q{margin-top:14px;padding:14px 18px;background:rgba(15,23,42,.5);border-radius:10px;border:1px solid rgba(51,65,85,.3)}
.passage-q .q-text{color:#f1f5f9;font-weight:600;margin-bottom:8px;font-size:.92rem}
.passage-q .q-opt{display:block;padding:5px 0;color:var(--c-muted);cursor:default;font-size:.88rem}
.passage-q .show-answer{color:var(--c-green);font-weight:600;margin-top:4px;display:none}

.translate-card{background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.5));border:1px solid rgba(51,65,85,.4);border-radius:14px;padding:22px;margin-bottom:14px;backdrop-filter:blur(4px);transition:all .25s}
.translate-card:hover{border-color:rgba(56,189,248,.3)}
.translate-card .zh-source{color:#f1f5f9;font-size:1.05rem;margin-bottom:12px;line-height:1.7}
.translate-card .en-answer{color:var(--c-green);display:none;margin-top:10px;line-height:1.7;padding:10px 14px;background:rgba(5,150,105,.08);border-radius:8px;border:1px solid rgba(5,150,105,.15)}
.translate-card .btn-reveal{margin-top:8px}

.topic-card{background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.5));border:1px solid rgba(51,65,85,.4);border-radius:14px;padding:22px;margin-bottom:14px;backdrop-filter:blur(4px);transition:all .25s}
.topic-card:hover{border-color:rgba(56,189,248,.3)}
.topic-card .topic-title{color:var(--c-accent);font-weight:700;margin-bottom:8px;font-size:1.02rem}
.topic-card .topic-outline{color:var(--c-muted);line-height:1.8;font-size:.9rem}
.topic-card .topic-sample{color:var(--c-text2);line-height:1.8;margin-top:12px;display:none;padding:14px 18px;background:rgba(15,23,42,.5);border-radius:10px;border:1px solid rgba(51,65,85,.3)}

.template-card{background:linear-gradient(145deg,rgba(30,41,59,.7),rgba(15,23,42,.5));border:1px solid rgba(51,65,85,.4);border-radius:14px;padding:20px;margin-bottom:12px;backdrop-filter:blur(4px);transition:all .25s}
.template-card:hover{border-color:rgba(124,58,237,.3);transform:translateX(3px)}
.template-card .tpl-title{color:#818cf8;font-weight:700;margin-bottom:8px;font-size:.85rem}
.template-card .tpl-en{color:#f1f5f9;margin-bottom:4px;line-height:1.5;font-size:.95rem;font-weight:500}
.template-card .tpl-zh{color:var(--c-muted);font-size:.82rem}
.template-card .tpl-use{color:var(--c-green);font-size:.78rem;margin-top:6px;padding:3px 10px;background:rgba(94,234,212,.08);border-radius:20px;display:inline-block}

/* ── Cloze ── */
.cloze-text{color:var(--c-text2);line-height:2.5;margin-bottom:22px;font-size:.93rem}
.cloze-blank{display:inline-block;width:88px;padding:2px 8px;border-bottom:2px dashed rgba(56,189,248,.5);text-align:center;color:var(--c-accent);font-weight:700;margin:0 3px;font-size:.9rem;cursor:pointer;transition:all .25s;border-radius:2px}
.cloze-blank:hover{background:rgba(56,189,248,.08);border-color:var(--c-accent)}
.cloze-blank.revealed{border-color:#10b981;color:var(--c-green);background:rgba(5,150,105,.08)}
.cloze-options{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.cloze-options .opt-chip{padding:7px 16px;background:rgba(15,23,42,.5);border:1px solid rgba(51,65,85,.4);border-radius:20px;color:var(--c-muted);cursor:default;font-size:.85rem;transition:all .2s;font-weight:500}
.cloze-options .opt-chip:hover{border-color:var(--c-accent);color:#e2e8f0}

/* ── Dictionary Modal ── */
.dict-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:999;display:none;justify-content:center;align-items:flex-start;padding-top:5vh}
.dict-overlay.show{display:flex}
.dict-modal{background:linear-gradient(160deg,#1a2740,#1e293b);border:1px solid rgba(51,65,85,.6);border-radius:20px;padding:32px;max-width:540px;width:92%;max-height:85vh;overflow-y:auto;position:relative;animation:dictIn .3s cubic-bezier(.4,0,.2,1);box-shadow:0 24px 80px rgba(0,0,0,.5)}
@keyframes dictIn{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.dict-close{position:absolute;top:14px;right:18px;background:rgba(51,65,85,.4);border:none;color:var(--c-muted);font-size:1.2rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.dict-close:hover{background:rgba(220,38,38,.3);color:#fca5a5}
.dict-word{font-size:2rem;font-weight:800;color:#f1f5f9;letter-spacing:.5px}
.dict-phonetic{color:var(--c-accent);font-size:1rem;margin:10px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dict-phonetic button{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);border-radius:50%;color:var(--c-green);cursor:pointer;font-size:1rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.dict-phonetic button:hover{background:rgba(56,189,248,.2)}
.dict-pos{display:inline-block;padding:4px 12px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.15);border-radius:20px;color:var(--c-accent);font-size:.78rem;font-weight:600;margin-right:6px}
.dict-def{color:var(--c-text2);line-height:1.8;margin:8px 0;padding-left:10px;border-left:2px solid rgba(56,189,248,.2)}
.dict-ex{color:var(--c-muted);font-style:italic;margin:4px 0 4px 18px;font-size:.88rem}
.dict-syn{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dict-syn span{background:rgba(94,234,212,.08);border:1px solid rgba(94,234,212,.15);padding:4px 12px;border-radius:20px;color:var(--c-green);font-size:.8rem;cursor:pointer;transition:all .2s;font-weight:500}
.dict-syn span:hover{background:rgba(94,234,212,.18);transform:translateY(-1px)}
.dict-loading{text-align:center;padding:40px;color:var(--c-dim)}

@media(max-width:500px){
  header h1{font-size:1.5rem}
  .flashcard{height:240px}
  .flashcard .word{font-size:1.6rem}
  .quiz-options{grid-template-columns:1fr}
  nav button{font-size:.7rem;padding:8px 3px}
  .word-table .ex-td{display:none}

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">☀️</button>
<div id="updateBanner" style="display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:10px 20px;border-radius:24px;font-size:.85rem;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(5,150,105,.4);animation:dictIn .3s" onclick="syncRemoteContent();this.style.display='none'">🔄 内容更新可用，点击刷新</div>

<div class="container">
  <header>
    <h1>CET-6 英语学习助手</h1>
    <p>词汇 · 词组 · 外刊 · 真题 | 全方位备考</p>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <nav>
    <button data-view="flashcard" class="active">抽认卡</button>
    <button data-view="quiz">测验</button>
    <button data-view="wordlist">词汇表</button>
    <button data-view="phrase">词组</button>
    <button data-view="news">外刊阅读</button>
    <button data-view="practice">六级真题</button>
  </nav>

  <!-- ═══════ 抽认卡 ═══════ -->
  <div id="flashcard" class="view active">
    <div class="flashcard-wrap">
      <div class="flashcard" id="card" onclick="flipCard()">
        <div class="front"><div class="word" id="fcWord"></div><div class="phonetic" id="fcPhonetic"></div><div class="pos" id="fcPos"></div><div class="hint">点击翻转查看释义</div></div>
        <div class="back"><div class="meaning" id="fcMeaning"></div><div class="phonetic-back" id="fcPhoneticBack"></div><div class="example" id="fcExample"></div></div>
      </div>
    </div>
    <div class="card-controls">
      <button class="btn btn-gray" onclick="prevCard()">上一个</button>
      <button class="btn btn-green" onclick="toggleKnownCard()">已掌握</button>
      <button class="btn btn-red" onclick="markCardUnknown()">未掌握</button>
      <button class="btn btn-gray" onclick="nextCard()">下一个</button>
    </div>
    <div class="card-controls" style="margin-top:8px">
      <select class="filter-select" id="cardFilter" onchange="resetCardIndex()">
        <option value="all">全部词汇</option><option value="unknown">未掌握</option><option value="known">已掌握</option><option value="review">📅 今日复习</option><option value="weak">🎯 薄弱词</option>
      </select>
      <button class="btn btn-blue" onclick="randomCard()">随机</button>
    </div>
  </div>

  <!-- ═══════ 测验 ═══════ -->
  <div id="quiz" class="view">
    <div class="quiz-wrap" id="quizSetup">
      <div style="text-align:center;margin:40px 0">
        <p style="font-size:1.2rem;margin-bottom:20px">选择测验模式</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">

          <button class="btn btn-blue" onclick="startQuiz(20)">20 题标准</button>
          <button class="btn btn-blue" onclick="startQuiz(50)">50 题挑战</button>
          <button class="btn btn-purple" onclick="startPhraseQuiz(15)">词组测验</button>
        </div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px">
          <button class="btn btn-green" onclick="startDaily()">🔥 每日挑战 (20词)</button>
          <button class="btn btn-red" onclick="startWeakQuiz()" id="weakWordBtn">🎯 薄弱词专练</button>
        </div>
        <p style="color:var(--c-dim);margin-top:16px;font-size:.8rem">看中文释义 → 选择正确的英文</p>
      </div>
    </div>
    <div class="quiz-wrap" id="quizPlay" style="display:none">
      <div class="quiz-progress"><span id="quizNum"></span><span class="bar-wrap"><span class="bar-fill" id="quizBar" style="width:0%"></span></span><span id="quizScore"></span></div>

      <div class="quiz-options" id="quizOptions"></div>
    </div>
    <div class="quiz-wrap" id="quizEnd" style="display:none"></div>
  </div>

  <!-- ═══════ 词汇表 ═══════ -->
  <div id="wordlist" class="view">
    <div class="list-controls">
      <input class="search-input" placeholder="搜索单词..." id="wordSearch" oninput="renderWordList()">
      <select class="filter-select" id="wordFilter" onchange="renderWordList()">
        <option value="all">全部</option><option value="known">已掌握</option><option value="unknown">未掌握</option>
      </select>
    </div>
    <div style="max-height:60vh;overflow-y:auto">

    </div>
  </div>

  <!-- ═══════ 词组 ═══════ -->
  <div id="phrase" class="view">
    <div class="list-controls">
      <input class="search-input" placeholder="搜索词组..." id="phraseSearch" oninput="renderPhraseList()">

      </select>
    </div>
    <div style="max-height:60vh;overflow-y:auto">
      <table class="word-table"><thead><tr><th>#</th><th>词组</th><th>释义</th><th>分类</th><th>状态</th></tr></thead><tbody id="phraseListBody"></tbody></table>
    </div>
  </div>

  <!-- ═══════ 外刊阅读 ═══════ -->
  <div id="news" class="view">
    <div class="news-source-bar" id="newsCatBar"></div>
    <div id="newsContent"></div>
  </div>

  <!-- ═══════ 六级真题 ═══════ -->
  <div id="practice" class="view">
    <div class="practice-tabs">
      <button class="active" data-sub="reading">阅读理解</button>
      <button data-sub="cloze">完形填空</button>
      <button data-sub="banked">选词填空</button>

    <div id="sub-cloze" class="practice-subview"></div>
    <div id="sub-banked" class="practice-subview"></div>
    <div id="sub-translation" class="practice-subview"></div>
    <div id="sub-writing" class="practice-subview"></div>
  </div>
</div>

const STORAGE_KEY = 'cet6_progress_v2';
let progress = loadProgress();
let cardIndex = 0, filteredWords = [...WORDS], quizState = null, currentNewsSource = 'bbc';

function loadProgress() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : defaultProgress(); }
  catch(e) { return defaultProgress(); }
}
function defaultProgress() { return { known: {}, phraseKnown: {}, quizTotal: 0, quizCorrect: 0, srs: {}, errors: {}, streak: { count: 0, lastDate: '' }, dailyDone: '' }; }
function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); updateStats(); }
function isKnown(id) { return !!progress.known[id]; }
function isPhraseKnown(id) { return !!progress.phraseKnown[id]; }

// SRS 间隔复习 ── 阶段: 0=新学 → 1=1天后 → 2=3天后 → 3=7天后 → 4=14天后 → 5=30天后 → 6=已掌握
const SRS_INTERVALS = [0, 1, 3, 7, 14, 30];
function getSRS(id) { return progress.srs[id] || { stage: 0, nextReview: 0 }; }
function advanceSRS(id) {
  const s = getSRS(id);
  if (s.stage < 5) s.stage++;
  const days = SRS_INTERVALS[s.stage];
  s.nextReview = Date.now() + days * 86400000;
  progress.srs[id] = s; saveProgress();
}
function resetSRS(id) { progress.srs[id] = { stage: 0, nextReview: 0 }; saveProgress(); }
function getReviewDue() {
  const now = Date.now();
  return WORDS.filter(w => { const s = getSRS(w.id); return s.nextReview > 0 && s.nextReview <= now && s.stage < 6; });
}
function getWeakWords() {
  return Object.entries(progress.errors || {})
    .filter(([id, c]) => c >= 2)
    .sort((a, b) => b[1] - a[1])
    .map(([id]) => WORDS.find(w => w.id === parseInt(id)))
    .filter(Boolean);
}

// 签到
function checkInToday() {
  const today = new Date().toDateString();
  if (progress.dailyDone === today) return;
  const lastDate = progress.streak.lastDate ? new Date(progress.streak.lastDate) : null;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (lastDate && lastDate.toDateString() === yesterday) progress.streak.count++;
  else if (!lastDate || lastDate.toDateString() !== today) progress.streak.count = 1;
  progress.streak.lastDate = today;
  progress.dailyDone = today;
  saveProgress();
}

  const kc = WORDS.filter(w => isKnown(w.id)).length;
  const pc = PHRASES.filter(p => isPhraseKnown(p.id)).length;
  const acc = progress.quizTotal > 0 ? Math.round((progress.quizCorrect / progress.quizTotal) * 100) : 0;

    <div class="stat-card"><div class="num">🔥 ${streak}</div><div class="label">连续签到</div></div>
  `;
}

// ═══════════════════ 抽认卡 ═══════════════════
const phonCache = {};
function showCard() {
  if (!filteredWords.length) { document.getElementById('fcWord').textContent='暂无单词'; document.getElementById('fcPos').textContent=''; return; }
  if (cardIndex >= filteredWords.length) cardIndex = 0;
  const w = filteredWords[cardIndex];
  document.getElementById('fcWord').textContent = w.en;
  // 音标
  const phEl = document.getElementById('fcPhonetic');
  const phBack = document.getElementById('fcPhoneticBack');
  const phText = w.phonetic || phonCache[w.en] || '';
  if (phText) {
    phEl.textContent = '/' + phText + '/';
    phBack.textContent = '/' + phText + '/';
  } else {
    phEl.textContent = '';
    phBack.textContent = '';
    fetchPhonetic(w);
  }
  const s = getSRS(w.id);
  const stageLabels = ['🆕 新学', '📅 1天后复习', '📅 3天后', '📅 7天后', '📅 14天后', '📅 30天后', '✅ 掌握'];
  const stageText = isKnown(w.id) ? (s.stage >= 6 ? stageLabels[6] : stageLabels[s.stage] || stageLabels[0]) : '';
  document.getElementById('fcPos').textContent = w.pos + (stageText ? ' · ' + stageText : '');
  document.getElementById('fcMeaning').textContent = w.zh;
  document.getElementById('fcExample').textContent = w.ex;
  document.getElementById('card').classList.remove('flipped');
}

async function fetchPhonetic(w) {
  if (phonCache[w.en]) return;
  try {
    const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w.en)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    const ph = data[0]?.phonetic || data[0]?.phonetics?.find(p => p.text)?.text || '';
    if (ph) {
      phonCache[w.en] = ph.replace(/[\/\[\]]/g, '');
      w.phonetic = w.phonetic || phonCache[w.en];
      const el = document.getElementById('fcPhonetic');
      const elBack = document.getElementById('fcPhoneticBack');
      if (el && document.getElementById('fcWord').textContent === w.en) {
        el.textContent = '/' + phonCache[w.en] + '/';
        if (elBack) elBack.textContent = '/' + phonCache[w.en] + '/';
      }
    }
  } catch(e) {}
}
function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
function nextCard() { cardIndex = (cardIndex + 1) % filteredWords.length; showCard(); }
function prevCard() { cardIndex = (cardIndex - 1 + filteredWords.length) % filteredWords.length; showCard(); }
function randomCard() { cardIndex = Math.floor(Math.random() * filteredWords.length); showCard(); }
function toggleKnownCard() {
  if (!filteredWords.length) return;
  const w = filteredWords[cardIndex];
  if (isKnown(w.id)) { progress.known[w.id] = false; resetSRS(w.id); }
  else { progress.known[w.id] = true; advanceSRS(w.id); }
  saveProgress();
  const filter = document.getElementById('cardFilter').value;
  if (filter !== 'all') { filteredWords = getFilteredWords(filter); cardIndex = 0; }
  showCard();
}
function markCardUnknown() {
  if (!filteredWords.length) return;
  const w = filteredWords[cardIndex];
  progress.known[w.id] = false; resetSRS(w.id); saveProgress();
}
function getFilteredWords(filter) {
  if (filter === 'known') return WORDS.filter(w => isKnown(w.id));
  if (filter === 'unknown') return WORDS.filter(w => !isKnown(w.id));
  if (filter === 'review') return getReviewDue();
  if (filter === 'weak') return getWeakWords();
  return [...WORDS];
}
function resetCardIndex() { filteredWords = getFilteredWords(document.getElementById('cardFilter').value); cardIndex = 0; showCard(); }

function renderWordList() {
  const s = document.getElementById('wordSearch').value.toLowerCase();
  const f = document.getElementById('wordFilter').value;
  let words = f === 'known' ? WORDS.filter(w=>isKnown(w.id)) : f === 'unknown' ? WORDS.filter(w=>!isKnown(w.id)) : [...WORDS];
  if (s) words = words.filter(w => w.en.toLowerCase().includes(s) || w.zh.includes(s));
  document.getElementById('wordListBody').innerHTML = words.map((w,i) => {
    let ph = w.phonetic || phonCache[w.en] || '';
    return `<tr><td style="color:var(--c-dim)">${i+1}</td>
    <td class="en">${w.en}</td>
    <td style="color:#38bdf8;font-size:.8rem">${ph ? '/' + ph + '/' : ''}</td>
    <td class="zh">${w.zh}</td><td class="ex-td">${w.ex}</td>
    <td><button class="status-btn ${isKnown(w.id)?'known':''}" onclick="progress.known[${w.id}]=!isKnown(${w.id});saveProgress();renderWordList();">${isKnown(w.id)?'✓ 已掌握':'未掌握'}</button></td></tr>`;
  }).join('');
}

// ═══════════════════ 词组 ═══════════════════
function renderPhraseList() {
  const s = document.getElementById('phraseSearch').value.toLowerCase();
  const f = document.getElementById('phraseFilter').value;
  let phrases = f === 'all' ? [...PHRASES] : PHRASES.filter(p => p.cat === f);
  if (s) phrases = phrases.filter(p => p.en.toLowerCase().includes(s) || p.zh.includes(s));
  document.getElementById('phraseListBody').innerHTML = phrases.map((p,i) => `
    <tr><td style="color:var(--c-dim)">${i+1}</td>
    <td class="en">${p.en}</td><td class="zh">${p.zh}</td><td style="color:var(--c-muted);font-size:.8rem">${p.cat}</td>
    <td><button class="status-btn ${isPhraseKnown(p.id)?'known':''}" onclick="progress.phraseKnown['${p.id}']=!isPhraseKnown('${p.id}');saveProgress();renderPhraseList();">${isPhraseKnown(p.id)?'✓ 已掌握':'未掌握'}</button></td></tr>
  `).join('');
}

// ═══════════════════ 测验 ═══════════════════
function resetQuiz() {
  document.getElementById('quizSetup').style.display='block';
  document.getElementById('quizPlay').style.display='none';
  document.getElementById('quizEnd').style.display='none';
  // 更新薄弱词按钮状态
  const btn = document.getElementById('weakWordBtn');
  if (btn) {
    const weak = getWeakWords();
    btn.textContent = weak.length >= 4 ? `🎯 薄弱词专练 (${weak.length})` : '🎯 薄弱词专练 (不足)';
    btn.style.opacity = weak.length >= 4 ? '1' : '.5';
  }
}
function startQuiz(count) { startGenericQuiz(WORDS, count, false); }
function startPhraseQuiz(count) { startGenericQuiz(PHRASES, count, true); }

function startDaily() {
  const items = [...WORDS]; shuffle(items);
  quizState = { items: items.slice(0, Math.min(20, items.length)), current: 0, score: 0, answered: false, isPhrase: false, isDaily: true };
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('quizPlay').style.display='block';
  document.getElementById('quizEnd').style.display='none';
  showQuizQuestion();
}

function startWeakQuiz() {
  const weak = getWeakWords();
  if (weak.length < 4) {
    alert('薄弱词不足（需要至少4个出错过2次以上的词），多做几轮测验再来吧！');
    return;
  }
  const items = [...weak]; shuffle(items);
  quizState = { items: items.slice(0, Math.min(20, items.length)), current: 0, score: 0, answered: false, isPhrase: false, isDaily: false };
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('quizPlay').style.display='block';
  document.getElementById('quizEnd').style.display='none';
  showQuizQuestion();
}

function startGenericQuiz(pool, count, isPhrase) {
  const items = [...pool]; shuffle(items);
  quizState = { items: items.slice(0, Math.min(count, items.length)), current: 0, score: 0, answered: false, isPhrase };
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('quizPlay').style.display='block';
  document.getElementById('quizEnd').style.display='none';
  showQuizQuestion();
}

function showQuizQuestion() {
  if (quizState.current >= quizState.items.length) { endQuiz(); return; }
  quizState.answered = false;
  const q = quizState.items[quizState.current];
  document.getElementById('quizNum').textContent = `${quizState.current + 1} / ${quizState.items.length}`;
  document.getElementById('quizBar').style.width = ((quizState.current / quizState.items.length) * 100) + '%';
  document.getElementById('quizScore').textContent = `正确: ${quizState.score}`;
  document.getElementById('quizQuestion').textContent = q.zh;
  const pool = quizState.isPhrase ? PHRASES : WORDS;
  const others = pool.filter(x => x.id !== q.id); shuffle(others);
  const options = [q, ...others.slice(0, 3)]; shuffle(options);
  document.getElementById('quizOptions').innerHTML = options.map(opt => `<div class="quiz-option" onclick="selectQuizOption('${opt.id}','${q.id}',this)">${opt.en}</div>`).join('');
}

function selectQuizOption(selectedId, correctId, btn) {
  if (quizState.answered) return;
  quizState.answered = true;
  progress.quizTotal++;
  const pool = quizState.isPhrase ? PHRASES : WORDS;
  const correctItem = pool.find(x => x.id === correctId);
  document.querySelectorAll('#quizOptions .quiz-option').forEach(opt => {
    if (opt.textContent.trim() === correctItem.en) opt.classList.add('correct');
  });
  if (selectedId === correctId) { quizState.score++; progress.quizCorrect++; }
  else {
    btn.classList.add('wrong');
    // 记录错误次数
    if (!quizState.isPhrase) {
      const cid = typeof correctId === 'number' ? correctId : parseInt(correctId);
      progress.errors[cid] = (progress.errors[cid] || 0) + 1;
    }
  }
  if (quizState.isPhrase) progress.phraseKnown[correctId] = true;
  else progress.known[parseInt(correctId)] = true;
  saveProgress();
  setTimeout(() => { quizState.current++; showQuizQuestion(); }, 800);
}

function endQuiz() {
  document.getElementById('quizPlay').style.display='none';
  const t = quizState.items.length, s = quizState.score, pct = Math.round((s/t)*100);
  const msg = pct>=80?'优秀！':pct>=60?'不错，继续加油！':'多练练，你可以的！';
  const isDaily = quizState.isDaily || false;
  if (isDaily && pct >= 70) checkInToday();
  document.getElementById('quizEnd').style.display='block';
  document.getElementById('quizEnd').innerHTML = `<div class="quiz-result">
    <div class="score">${s} / ${t}</div>
    <p style="color:var(--c-muted);margin-top:8px">正确率 ${pct}%</p>
    <p style="color:var(--c-accent);margin-top:12px;font-size:1.1rem">${isDaily && pct>=70 ? '🎉 签到成功！' : msg}</p>
    <button class="btn btn-blue" style="margin-top:16px" onclick="resetQuiz()">再来一轮</button>
    ${isDaily && pct<70 ? '<p style="color:var(--c-muted);margin-top:8px;font-size:.8rem">正确率需≥70%才能签到</p>' : ''}
  </div>`;
}
