const NEWS = [
  // ═══ 科技与AI (3篇) ═══
  { cat:"科技与AI", source:"The Economist", date:"2026-07", title:"How Artificial Intelligence Is Reshaping the Global Job Market", desc:`The rapid advancement of artificial intelligence is fundamentally transforming the global labor market at an unprecedented pace. According to a comprehensive report released by the McKinsey Global Institute, up to 375 million workers worldwide—approximately 14% of the global workforce—may need to switch occupational categories by 2030 due to automation and AI-driven disruption.

The report identifies several sectors most vulnerable to transformation. Manufacturing, retail, and administrative support roles face the highest risk of automation, with routine cognitive and manual tasks increasingly performed by intelligent systems. However, the report also emphasizes that AI will create new categories of jobs that do not yet exist, much as the internet revolution spawned entirely new industries.

A particularly striking finding is that high-skilled professions once considered immune to automation—including law, medicine, and financial analysis—are now experiencing significant AI-driven change. Legal document review, medical image analysis, and algorithmic trading are increasingly performed by AI systems with accuracy rates that match or exceed human professionals.

The transition, according to the report, will require massive investment in education and retraining programs. The World Economic Forum estimates that 54% of all employees will require significant reskilling by 2028. Countries with robust social safety nets and flexible education systems are expected to navigate this transition more successfully than those with rigid labor markets and underfunded training programs.

The geographic impact of AI-driven job displacement is expected to be highly uneven. Developed economies, where service-sector and knowledge-work jobs predominate, may face more immediate disruption than developing nations still reliant on agriculture and manufacturing. However, developing countries may ultimately face greater challenges due to limited resources for workforce retraining.

Despite the alarming headline numbers, many economists remain cautiously optimistic. Historical precedents suggest that technological revolutions, while disruptive in the short term, ultimately create more jobs than they eliminate. The key variable, experts agree, is whether societies can manage the transition equitably and ensure that the benefits of AI-driven productivity gains are broadly shared rather than concentrated among a small elite.`, keywords:["artificial intelligence","automation","workforce","disruption","manufacturing","cognitive","algorithm","transition","retraining","productivity"] },
  { cat:"科技与AI", source:"WIRED", date:"2026-06", title:"The Ethics of Autonomous Weapons: A Growing International Concern", desc:`The development of lethal autonomous weapons systems—often called "killer robots"—has emerged as one of the most contentious issues in international security and technology ethics. Unlike drones, which are remotely operated by human pilots, autonomous weapons would be capable of selecting and engaging targets without direct human intervention.

A coalition of over 120 non-governmental organizations, operating under the "Campaign to Stop Killer Robots," has been pressing for a preemptive international ban on fully autonomous weapons. The campaign argues that delegating life-and-death decisions to machines crosses a fundamental moral threshold and could lead to an arms race that destabilizes global security.

The United Nations has held multiple rounds of discussions on the issue through the Convention on Certain Conventional Weapons. While a majority of participating nations support some form of regulation, a small group of militarily advanced countries—including the United States, Russia, and Israel—have resisted calls for a binding treaty, arguing that autonomous systems could reduce civilian casualties through greater precision and eliminate human errors caused by fatigue or emotional stress.

Proponents of autonomous weapons point to potential humanitarian benefits. An AI-guided missile, they argue, could identify and avoid civilian infrastructure with greater accuracy than a human operator under combat stress. Autonomous systems could also be deployed in environments too dangerous or inaccessible for human soldiers, such as deep-sea mine clearance or nuclear disaster response.

Critics counter that current AI technology remains fundamentally unreliable in complex, unpredictable combat environments. Machine learning systems can be fooled by adversarial examples—subtle alterations to input data that cause AI to misclassify what it perceives. In a battlefield context, such errors could have catastrophic consequences.

The debate also raises profound questions about accountability under international humanitarian law. If an autonomous weapon commits a war crime, who bears responsibility—the programmer, the commanding officer, the manufacturer, or the machine itself? Current legal frameworks provide no clear answer.`, keywords:["autonomous","weapons","ethics","coalition","regulation","precision","civilian","humanitarian","accountability","framework"] },
  { cat:"科技与AI", source:"Nature", date:"2026-05", title:"Breakthrough in Nuclear Fusion Brings Clean Energy Closer to Reality", desc:`Scientists at the Joint European Torus facility in Oxfordshire have achieved a landmark milestone in the pursuit of practical nuclear fusion energy, sustaining a plasma reaction at 150 million degrees Celsius for a record-breaking eight minutes. The achievement represents a significant step toward the long-held dream of harnessing the same energy source that powers the sun.

Nuclear fusion, which involves fusing hydrogen atoms to form helium under extreme temperatures and pressure, promises virtually limitless clean energy with no greenhouse gas emissions and minimal radioactive waste. Unlike nuclear fission, which splits atoms and produces long-lived radioactive byproducts, fusion's primary waste product is helium—an inert, non-toxic gas.

The challenge has always been achieving "net energy gain"—producing more energy from the fusion reaction than is consumed in creating and sustaining it. In December 2022, the National Ignition Facility in California achieved the first-ever controlled fusion reaction with net energy gain, albeit at a tiny scale. The latest European experiment demonstrates sustained plasma confinement at a scale relevant to commercial power generation.

The international ITER project, under construction in southern France, represents the next major milestone. Backed by 35 nations including China, the European Union, India, Japan, Russia, South Korea, and the United States, ITER aims to demonstrate sustained fusion at industrial scale by 2035. If successful, it could pave the way for the first fusion power plants by mid-century.

Significant engineering challenges remain. The reactor materials must withstand neutron bombardment that would render most conventional materials brittle and radioactive within months. Developing "low-activation" materials capable of surviving in such extreme environments is an active area of research.

Private sector interest has surged in recent years. More than 30 fusion startups have collectively raised over $5 billion in investment, pursuing alternative approaches including smaller, more modular reactor designs. Some analysts believe the private sector could accelerate the timeline, with several companies targeting demonstration reactors by the early 2030s.`, keywords:["fusion","plasma","sustainable","emission","radioactive","confinement","reactor","investment","modular","demonstrate"] },

  // ═══ 环境与气候 (3篇) ═══
  { cat:"环境与气候", source:"National Geographic", date:"2026-07", title:"The Amazon Rainforest Approaching an Irreversible Tipping Point", desc:`New research published in the journal Science Advances warns that the Amazon rainforest is approaching a critical tipping point beyond which large portions of the ecosystem could irreversibly transform into savanna. The study, conducted by an international team of ecologists and climate scientists, analyzed satellite data spanning four decades to assess the rainforest's resilience to drought, deforestation, and rising temperatures.

The findings are alarming. Approximately 75% of the Amazon has shown declining resilience since the early 2000s, meaning the forest takes longer to recover from disturbances such as droughts and fires. Regions closest to human activity—near roads, agricultural areas, and settlements—show the most pronounced loss of resilience.

The Amazon plays a crucial role in regulating the global climate by absorbing approximately 2 billion tons of carbon dioxide annually—roughly 5% of global emissions. Its transformation from carbon sink to carbon source would dramatically accelerate climate change. Moreover, the forest generates much of its own rainfall through evapotranspiration; as tree cover decreases, the regional water cycle weakens, creating a self-reinforcing cycle of drying and degradation.

Deforestation remains the primary immediate threat. Despite commitments by the Brazilian government, annual deforestation rates have remained stubbornly high, driven by cattle ranching, soy cultivation, and illegal logging. A recent investigation revealed that approximately 20% of Brazil's beef exports to the European Union may be linked to illegally deforested land.

Indigenous communities, who have historically served as the most effective guardians of the forest, are increasingly under threat from land grabbers and illegal miners. Studies consistently show that deforestation rates on indigenous-managed lands are significantly lower than in other areas.

The window for action is narrowing. The scientists estimate that preventing the tipping point requires reducing deforestation to near zero and restoring at least 15% of degraded areas within the next decade. Achieving these goals, they argue, demands unprecedented international cooperation and financial support for forest nations.`, keywords:["rainforest","ecosystem","resilience","deforestation","drought","emission","evapotranspiration","degradation","indigenous","cooperation"] },
  { cat:"环境与气候", source:"BBC Future", date:"2026-06", title:"The Rise of Vertical Farming: Can Indoor Agriculture Feed the World?", desc:`In a nondescript warehouse on the outskirts of Copenhagen, rows of leafy greens stretch toward the ceiling under the purple glow of LED lights. No soil, no sunlight, and 95% less water than conventional farming—this is vertical farming, and its proponents believe it could revolutionize global food production.

The global vertical farming market has grown from $3.1 billion in 2020 to an estimated $15.7 billion in 2026, driven by advances in LED efficiency, automation, and hydroponic technology. Major investments from companies like Google Ventures and SoftBank have accelerated commercial deployment.

The environmental advantages are substantial. Vertical farms use a fraction of the land and water required by conventional agriculture and eliminate the need for chemical pesticides. Because production can be located in urban centers, transportation emissions are dramatically reduced. A head of lettuce grown in a vertical farm and delivered to a nearby supermarket may travel 50 kilometers rather than the 2,000 kilometers typical of conventional supply chains.

Critics, however, point to significant limitations. The high energy requirements of indoor farming—primarily for lighting and climate control—mean that its carbon footprint depends heavily on the energy source. A vertical farm powered by renewable energy can be genuinely sustainable, but one reliant on fossil fuel electricity may have a worse environmental profile than conventional farming.

Current technology also limits the variety of crops that can be grown profitably indoors. Leafy greens and herbs dominate the industry because they grow quickly and have high value per kilogram. Staple crops like wheat, rice, and corn—which together provide the majority of human calories—remain economically unviable for vertical farming due to their low market value relative to the energy inputs required.

The social dimension is equally complex. Vertical farming advocates emphasize the potential to create high-tech agricultural jobs in urban areas and reduce food deserts in underserved communities. Skeptics worry that the capital-intensive nature of the industry could further concentrate food production in the hands of a few large corporations.

The most promising model may be hybrid systems that combine the efficiency of vertical farming for high-value crops with conventional agriculture for staples, creating a more resilient and diversified global food system.`, keywords:["vertical","agriculture","hydroponic","pesticide","transportation","renewable","sustainable","staple","capital-intensive","diversified"] },
  { cat:"环境与气候", source:"The Atlantic", date:"2026-05", title:"The Global Water Crisis: Scarcity in an Age of Abundance", desc:`Water covers 71% of the Earth's surface, yet over 2 billion people lack access to safely managed drinking water. This paradox—scarcity amidst abundance—is one of the defining challenges of the 21st century, and it is projected to intensify dramatically in the coming decades.

The World Resources Institute's latest Aqueduct report projects that by 2030, global freshwater demand will exceed sustainable supply by 56%. Fourteen of the world's 20 megacities already experience water scarcity, and the number is expected to rise as urbanization accelerates across Asia and Africa.

Climate change is the primary accelerant. Rising temperatures increase evaporation rates and alter precipitation patterns, turning historically fertile regions into drought-prone zones. The Western United States is experiencing its most severe megadrought in 1,200 years, while Cape Town narrowly avoided "Day Zero"—when municipal water supplies would be shut off—in 2018 through extraordinary conservation measures.

Agriculture accounts for approximately 70% of global freshwater withdrawals, making it both the primary cause of water stress and the sector with the greatest potential for efficiency gains. Precision irrigation technologies, drought-resistant crop varieties, and shifts toward less water-intensive crops could dramatically reduce agricultural water demand.

Industrial and domestic use presents different challenges. Aging infrastructure in many developed countries results in staggering water losses—London loses approximately 25% of its treated water to leaks. In developing countries, the challenge is often a lack of infrastructure altogether, with millions relying on unsafe water sources.

The solutions exist, but they require political will and investment. Singapore's NEWater system, which recycles treated wastewater into high-grade reclaimed water, demonstrates that technology can transform water management. Israel's nationwide system of desalination plants and drip irrigation has turned a water-scarce nation into a water surplus country.

Water is fundamentally unlike other resources: it has no substitute. As climate change accelerates and populations grow, the ability to manage water sustainably may become the single most important determinant of national prosperity and stability.`, keywords:["scarcity","freshwater","sustainable","urbanization","precipitation","drought","irrigation","infrastructure","desalination","prosperity"] },

  // ═══ 经济与商业 (3篇) ═══
  { cat:"经济与商业", source:"Financial Times", date:"2026-07", title:"Cryptocurrency Regulation Enters a New Era of Global Coordination", desc:`After years of fragmented and often contradictory approaches to cryptocurrency regulation, a new era of global coordination is emerging. The Financial Stability Board, an international body that monitors the global financial system, has published a comprehensive framework for regulating digital assets that has been endorsed by all G20 member nations.

The framework addresses the key challenges that have plagued cryptocurrency markets: consumer protection, market integrity, financial stability, and the prevention of illicit finance. For the first time, major economies have agreed on common standards for capital requirements, custody arrangements, and disclosure obligations for cryptocurrency exchanges and other service providers.

The catalyst for this unprecedented coordination was the series of high-profile cryptocurrency collapses and fraud cases that occurred between 2022 and 2025, including the bankruptcy of several major exchanges and the collapse of prominent stablecoins. These events erased hundreds of billions of dollars in market value and affected millions of retail investors worldwide.

Stablecoins—cryptocurrencies designed to maintain a stable value relative to a fiat currency—receive particular regulatory scrutiny under the new framework. Issuers will be required to hold high-quality liquid assets equivalent to 100% of outstanding tokens and submit to regular audits. This addresses the central vulnerability exposed by previous stablecoin collapses: the mismatch between the promise of stability and the often-risky assets backing them.

The framework takes a notably different approach to central bank digital currencies, or CBDCs, which are being developed by over 100 countries. CBDCs are treated as sovereign instruments and therefore subject to a separate regulatory track, though the framework encourages interoperability standards.

Industry reaction has been mixed. Established cryptocurrency firms with strong compliance programs have generally welcomed the clarity, arguing that regulatory certainty will attract institutional investment and mainstream adoption. Smaller, less regulated entities warn that the compliance costs could drive innovation offshore.

The implementation timeline extends through 2028, with a review mechanism established to assess the framework's effectiveness and make adjustments as the technology evolves. Whether this marks the beginning of a stable, mature cryptocurrency market or merely a temporary truce in the ongoing struggle between innovation and regulation remains to be seen.`, keywords:["regulation","framework","coordination","integrity","stablecoin","compliance","sovereign","institutional","assessment","mechanism"] },
  { cat:"经济与商业", source:"Harvard Business Review", date:"2026-06", title:"The Four-Day Work Week: From Experiment to Mainstream Movement", desc:`The largest-ever global trial of the four-day work week has concluded, delivering results that may accelerate the transformation of workplace norms across industries and continents. The coordinated experiment, involving over 200 companies and 10,000 workers across 15 countries, found that 92% of participating companies plan to continue with the reduced schedule.

The results challenge deeply ingrained assumptions about productivity and working hours. Despite working 20% fewer hours, participating companies reported that revenue remained stable or increased over the trial period. Employee well-being metrics showed dramatic improvements: stress levels decreased by 39%, burnout reduced by 71%, and work-life satisfaction scores rose significantly.

The mechanism behind these results is revealing. Companies that successfully adopted the four-day week did not simply compress five days of work into four. Instead, they implemented deliberate efficiency improvements: reducing meeting lengths, streamlining communication protocols, eliminating non-essential tasks, and empowering employees to redesign their workflows.

Sector-specific differences have emerged. Knowledge-based industries—technology, professional services, and creative agencies—reported the smoothest transitions, while client-facing businesses requiring fixed operating hours found implementation more challenging. Manufacturing firms with continuous production processes required the most creative solutions, often adopting staggered schedules rather than universal four-day weeks.

Critics raise important concerns. Some economists worry that the four-day week may primarily benefit high-skilled knowledge workers while leaving behind those in service and manual occupations where hours are more directly tied to output. There are also legitimate questions about whether the productivity gains observed during enthusiastic early adoption can be sustained over the long term.

The movement has gained particular momentum in Europe, where several governments are considering legislative support. Spain has launched a government-funded pilot program, while Belgium has become the first EU country to legally guarantee workers the right to a four-day week at full pay. In the United States, adoption has been driven primarily by private-sector initiatives rather than policy interventions.

The four-day work week represents more than a scheduling innovation; it embodies a fundamental reexamination of the relationship between time, productivity, and well-being in modern economies.`, keywords:["productivity","revenue","well-being","efficiency","implementation","client","legislative","innovation","guarantee","fundamental"] },
  { cat:"经济与商业", source:"The Economist", date:"2026-05", title:"Supply Chain Resilience: The New Priority in Global Trade", desc:`The era of hyper-efficient, just-in-time global supply chains is giving way to a new paradigm centered on resilience and redundancy. Three years of pandemic disruptions, geopolitical tensions, and climate-related shocks have fundamentally altered how companies and governments think about the global trade networks that underpin the modern economy.

A survey by McKinsey found that supply chain disruptions now cost the average company approximately 45% of one year's profits over a decade—a figure that has doubled since 2020. The financial impact has transformed supply chain management from a back-office operational concern into a board-level strategic priority.

The most visible manifestation of this shift is the trend toward "nearshoring" and "friendshoring"—relocating production closer to end consumers or to politically aligned countries. Mexico has emerged as a primary beneficiary, with foreign direct investment reaching record levels as companies establish manufacturing capacity to serve the North American market. Southeast Asian nations, particularly Vietnam and Indonesia, have seen similar investment surges.

Diversification of supplier bases has become another key strategy. The concentration of critical component manufacturing in single countries or even single factories—a practice that optimized costs in stable times—proved catastrophic when those nodes were disrupted. Companies are now building redundancy into their supply networks, even at the expense of some cost efficiency.

Technology is playing a crucial role in this transformation. Artificial intelligence and machine learning systems are being deployed to monitor supply chain risks in real time, from weather events to political instability to supplier financial health. Blockchain-based systems are enhancing traceability, allowing companies to verify the provenance and conditions of production throughout complex multi-tier supply chains.

The environmental dimension adds another layer of complexity. As companies face increasing pressure to reduce their carbon footprints, supply chains—which account for the majority of most companies' emissions—are becoming a focal point for sustainability efforts. This is driving demand for local sourcing, electrified logistics, and circular economy models that minimize waste.

The transition toward resilience comes with significant costs. The consulting firm BCG estimates that building resilient supply chains will require global investment of $2-4 trillion over the next decade. The fundamental question facing business leaders is whether these investments represent a temporary insurance premium against a turbulent period—or a permanent structural shift in how global trade operates.`, keywords:["resilience","redundancy","disruption","geopolitical","nearshoring","diversification","catastrophic","traceability","sustainability","structural"] },

  // ═══ 社会与文化 (3篇) ═══
  { cat:"社会与文化", source:"The New Yorker", date:"2026-07", title:"The Loneliness Epidemic: Understanding a Modern Crisis of Connection", desc:`In 2023, the U.S. Surgeon General issued an advisory describing loneliness and social isolation as a public health crisis, comparing its mortality impact to smoking 15 cigarettes a day. The report ignited a global conversation about what many had silently experienced: in an age of unprecedented digital connectivity, genuine human connection has become increasingly elusive.

The statistics are sobering. A meta-analysis of 90 studies covering over 2 million participants found that social isolation increases the risk of premature death by 29%, a figure that rivals well-established risk factors like obesity and physical inactivity. Loneliness has been linked to elevated rates of cardiovascular disease, dementia, depression, and anxiety.

The causes are multifaceted. The decline of traditional community institutions—churches, unions, neighborhood associations—has eroded the "third places" between work and home where people historically formed social bonds. Urban design that prioritizes automobiles over pedestrians has reduced the casual, unplanned interactions that build community cohesion. Economic precarity and the gig economy have weakened workplace relationships that once provided a sense of belonging.

Social media occupies an ambiguous position in this landscape. Research consistently shows that the quality of online interactions matters more than their quantity. Active, engaged use—direct messaging, commenting on friends' posts, participating in interest-based communities—can strengthen real-world relationships. Passive consumption—endless scrolling through curated highlight reels—tends to increase feelings of inadequacy and isolation.

Different demographic groups experience loneliness differently. Contrary to popular perception, young adults report higher rates of loneliness than the elderly in many studies. The transition to adulthood—leaving family, establishing new social networks, navigating romantic relationships—appears to be a period of particular vulnerability.

Governments have begun to respond. The United Kingdom appointed a Minister for Loneliness in 2018, and Japan followed with a Minister of Loneliness and Isolation in 2021. These initiatives fund community programs, support research, and coordinate across government departments to address the social determinants of connection.

Experts emphasize that addressing the loneliness crisis requires more than individual solutions. While personal strategies—cultivating existing relationships, joining groups, volunteering—are valuable, they argue that meaningful progress requires changes to the built environment, workplace culture, and digital platform design that shape our daily opportunities for connection.`, keywords:["epidemic","isolation","mortality","premature","cardiovascular","dementia","depression","cohesion","demographic","vulnerability"] },
  { cat:"社会与文化", source:"The Guardian", date:"2026-06", title:"The Rise of Digital Nomadism and the Transformation of Work-Life Boundaries", desc:`The COVID-19 pandemic inadvertently launched the world's largest-ever experiment in remote work, and one of its most visible legacies is the explosive growth of digital nomadism. An estimated 35 million people worldwide now identify as digital nomads—professionals who leverage technology to work remotely while traveling or living in locations of their choosing.

This phenomenon has profound implications for host communities. Cities like Lisbon, Bali, Mexico City, and Chiang Mai have experienced surges in digital nomad populations, attracted by lower costs of living, pleasant climates, and robust internet infrastructure. While this influx brings economic benefits—digital nomads spend an estimated $787 billion annually—it also raises concerns about gentrification, housing affordability, and cultural displacement.

Several countries have responded by creating dedicated "digital nomad visas" designed to attract remote workers. More than 60 nations now offer such programs, typically requiring proof of employment with a foreign company, minimum income thresholds, and health insurance. These visas represent a novel category in immigration policy, occupying a space between tourist visas and traditional work permits.

The digital nomad lifestyle is not without its psychological costs. Research published in the Journal of Occupational Health Psychology found that digital nomads report higher rates of loneliness and professional isolation than traditional remote workers, who typically maintain stronger connections to a home community. The constant novelty of travel can paradoxically lead to emotional exhaustion and a diminished sense of belonging.

Corporate attitudes toward digital nomadism span a wide spectrum. Some companies, particularly in the technology sector, have embraced fully distributed workforces. Others maintain strict requirements about employee location, often citing tax compliance, data security regulations, and concerns about team cohesion. A growing middle ground involves "work from anywhere" policies with defined limitations on duration and location.

The infrastructure supporting digital nomadism has matured rapidly. Co-working spaces, many operated by global brands like WeWork, have expanded aggressively in digital nomad hubs. Specialized insurance products, banking services for multi-currency lifestyles, and online communities that facilitate social connections have proliferated.

The larger significance of digital nomadism extends beyond the individuals practicing it. It represents a fundamental challenge to the geographic constraints that have historically bound workers to specific cities and countries—a challenge that may reshape patterns of global migration, urban development, and national identity in the decades ahead.`, keywords:["phenomenon","infrastructure","immigration","threshold","psychological","compliance","duration","migration","constraints","identity"] },
  { cat:"社会与文化", source:"TIME", date:"2026-05", title:"The Attention Economy: How Tech Companies Monetize Human Focus", desc:`The average person now encounters approximately 10,000 advertisements per day, up from roughly 500 in the 1970s. This staggering increase is not an accident—it is the deliberate outcome of an economic system built around the commodification of human attention, and it is reshaping our cognitive landscape in ways we are only beginning to understand.

The attention economy operates on a simple premise: in a world of information abundance, human attention is the scarce resource. Technology platforms compete fiercely for every second of user engagement because their business models depend on it. The more time users spend scrolling, watching, and clicking, the more data can be collected and the more advertisements can be served.

The neurobiological mechanisms that make this system so profitable are well understood by the companies that exploit them. Intermittent variable rewards—the same psychological principle that makes slot machines addictive—are embedded in the design of social media feeds, notification systems, and autoplay features. Each scroll or refresh offers the possibility of a rewarding piece of content, and this unpredictability is precisely what keeps users engaged.

The consequences for cognitive function are increasingly documented. A landmark study published in Nature Communications found that heavy social media users demonstrated significantly reduced attention spans and impaired ability to concentrate on demanding tasks compared to light users. The constant context-switching required by notification-driven interaction appears to degrade the brain's capacity for sustained focus.

Children and adolescents represent a population of particular concern. The adolescent brain, with its heightened sensitivity to social rewards and still-developing prefrontal cortex responsible for impulse control, is uniquely vulnerable to the attention economy's manipulative design features. Rates of anxiety, depression, and self-harm among teenagers have risen sharply in parallel with smartphone adoption, though the causal relationship remains contested among researchers.

Regulatory responses have been slow but are accelerating. The European Union's Digital Services Act requires platforms to assess and mitigate systemic risks, including those related to mental health. Several U.S. states have passed legislation restricting social media use by minors. However, critics argue that these measures address symptoms rather than the underlying business model that incentivizes addiction.

The emerging field of "humane technology" seeks to develop alternative models—products designed to serve user well-being rather than maximize engagement. Whether these alternatives can compete in a marketplace dominated by attention-optimized incumbents remains an open question, but growing public awareness of the attention economy's costs may create the demand necessary to sustain them.`, keywords:["commodification","abundance","engagement","mechanism","intermittent","cognitive","adolescent","impulse","legislation","incentive"] },

  // ═══ 健康与医学 (2篇) ═══
  { cat:"健康与医学", source:"Scientific American", date:"2026-06", title:"The Microbiome Revolution: How Gut Bacteria Shape Human Health", desc:`Over the past decade, our understanding of the human body has undergone a quiet revolution. The discovery that the trillions of microorganisms living in and on our bodies—collectively known as the human microbiome—play crucial roles in everything from digestion to mental health has opened entirely new frontiers in medicine.

The human gut alone contains approximately 1,000 species of bacteria, weighing roughly two kilograms in total. These microorganisms are not passive passengers; they actively interact with their human host through complex biochemical signaling pathways. They produce neurotransmitters that influence mood, regulate immune system function, extract nutrients from food that human enzymes cannot process, and even affect the expression of human genes.

The implications for disease are profound. Dysbiosis—an imbalance in the microbial community—has been implicated in conditions ranging from inflammatory bowel disease and obesity to depression and Parkinson's disease. A growing body of evidence suggests that the composition of an individual's gut microbiome may influence their response to cancer immunotherapy, potentially explaining why some patients experience dramatic recoveries while others derive no benefit from the same treatment.

Diet is the most powerful tool for modulating the microbiome. High-fiber diets rich in diverse plant foods promote microbial diversity, which is strongly associated with good health outcomes. In contrast, diets high in processed foods and low in fiber have been shown to reduce microbial diversity within days. The Western diet, characterized by its high content of refined sugars and saturated fats, is increasingly implicated in the epidemic of chronic inflammatory diseases.

The commercial microbiome industry has exploded, with probiotics, prebiotics, and microbiome testing kits now generating billions in revenue. However, the science remains far ahead of the regulation. Many probiotic products make claims unsupported by rigorous clinical evidence, and the FDA has issued warning letters to several companies for unsubstantiated marketing.

Fecal microbiota transplantation—the transfer of gut bacteria from a healthy donor to a patient—represents one of the most dramatic therapeutic applications. Originally developed to treat recurrent Clostridium difficile infections, where it achieves cure rates exceeding 90%, the technique is now being investigated for a wide range of conditions. However, standardized regulation and long-term safety data remain works in progress.

The microbiome represents a paradigm shift in how we understand human biology—from seeing the body as a singular entity to recognizing it as a complex ecosystem whose health depends on the diversity and balance of its microbial inhabitants.`, keywords:["microbiome","microorganism","bacteria","biochemical","immune","inflammation","obesity","microbial","therapeutic","paradigm"] },
  { cat:"健康与医学", source:"The Lancet", date:"2026-05", title:"Sleep Deprivation: The Hidden Public Health Crisis", desc:`Sleep deprivation has become so pervasive in modern society that its seriousness as a public health issue is frequently underestimated. The Centers for Disease Control and Prevention has declared insufficient sleep a public health epidemic, with approximately one-third of American adults regularly failing to obtain the recommended seven to nine hours of sleep per night.

The health consequences of chronic sleep deprivation extend far beyond the familiar experience of daytime fatigue. Epidemiological studies have consistently linked insufficient sleep to increased risk of cardiovascular disease, type 2 diabetes, obesity, and impaired immune function. A meta-analysis published in the journal Sleep found that individuals who consistently sleep less than six hours per night have a 12% higher risk of all-cause mortality compared to those sleeping seven to eight hours.

The cognitive effects are equally severe. Sleep plays an essential role in memory consolidation—the process by which the brain stabilizes and integrates new information acquired during wakefulness. Research conducted at the University of California, Berkeley, demonstrated that sleep-deprived individuals show a 40% reduction in their ability to form new memories. Furthermore, the glymphatic system, which clears metabolic waste products from the brain, is primarily active during deep sleep. The accumulation of these waste products, including beta-amyloid plaques associated with Alzheimer's disease, may explain the link between chronic sleep deprivation and increased dementia risk.

The economic toll is staggering. A RAND Corporation study estimated that insufficient sleep costs the U.S. economy approximately $411 billion annually—or 2.28% of GDP—in lost productivity. Japan, the United Kingdom, and Germany each lose between 1.4% and 2.9% of GDP for the same reason.

The causes of widespread sleep deprivation are deeply embedded in the structure of modern life. Shift work, which disrupts the circadian rhythm, affects approximately 20% of the global workforce. The proliferation of screens emitting blue-spectrum light suppresses melatonin production, delaying sleep onset. Cultural attitudes that valorize sleep deprivation as a sign of dedication and productivity remain stubbornly persistent.

Solutions exist but require both individual and systemic action. On a personal level, sleep hygiene practices—maintaining consistent sleep schedules, limiting evening screen time, avoiding caffeine after midday—are demonstrably effective. Systemically, later school start times for adolescents, workplace policies that discourage after-hours communication, and public health campaigns comparable to those for smoking cessation could yield substantial population-level benefits.`, keywords:["deprivation","epidemic","chronic","cardiovascular","diabetes","mortality","cognitive","consolidation","metabolic","circadian"] },

  // ═══ 教育 (2篇) ═══
  { cat:"教育", source:"The Chronicle of Higher Education", date:"2026-07", title:"The Crisis of the Humanities: Declining Enrollment and the Search for Relevance", desc:`Across universities in the United States and Europe, humanities disciplines are experiencing an enrollment crisis of historic proportions. The number of students majoring in English, history, philosophy, and foreign languages has declined by 30 to 50 percent over the past decade at many institutions, prompting department closures, faculty layoffs, and existential debates about the future of liberal education.

The proximate causes are not difficult to identify. Rising tuition costs and increasing student debt have intensified pressure on students and families to choose majors with clear vocational pathways. State governments have increasingly tied higher education funding to metrics emphasizing STEM graduates and workforce outcomes. The narrative—whether accurate or not—that humanities degrees lead to poor employment prospects has become deeply embedded in public discourse.

Yet the data suggests a more complex picture than the prevailing narrative acknowledges. Longitudinal studies tracking career outcomes find that humanities graduates ultimately achieve employment rates and salaries comparable to their peers in many professional fields, though the trajectory is often slower. Employers consistently rank skills cultivated by humanities education—critical thinking, analytical writing, persuasive communication, cultural competency—among the most valued attributes in the contemporary workplace.

The crisis has prompted a wide range of institutional responses. Some universities have integrated humanities more deliberately with professional programs, creating joint degrees that combine philosophy with computer science or history with public policy. Others have reoriented humanities curricula toward contemporary issues—climate change, artificial intelligence, global migration—to demonstrate the disciplines' relevance to urgent societal challenges.

The digital humanities represent an area of particular growth and innovation. Scholars are applying computational methods to literary and historical analysis, digitizing archives to make cultural heritage accessible to global audiences, and creating new forms of scholarly communication that transcend the traditional monograph. These approaches have attracted students who might otherwise gravitate exclusively toward STEM fields.

The debate extends beyond practical questions of enrollment and employment to fundamental questions about the purpose of higher education. Should universities primarily serve as pipelines to employment, or do they bear a broader responsibility to cultivate citizens capable of critical thought, ethical reasoning, and appreciation of cultural heritage? How societies answer these questions will shape not only the future of the humanities but the character of democratic citizenship in an increasingly complex world.`, keywords:["humanities","discipline","enrollment","vocational","longitudinal","analytical","curricula","innovation","heritage","democratic"] },
  { cat:"教育", source:"Education Week", date:"2026-05", title:"Rethinking Assessment: The Global Movement Away from Standardized Testing", desc:`A quiet but profound transformation is underway in educational assessment. After decades in which standardized testing dominated education systems from primary school through university admission, a growing movement of educators, policymakers, and researchers is advocating for more holistic approaches to evaluating student learning and potential.

The critique of standardized testing rests on multiple pillars. Research consistently shows that test scores correlate more strongly with family income and parental education levels than with college performance or career success, raising fundamental questions about equity and fairness. The narrowing effect of high-stakes testing—in which curriculum is reduced to tested subjects and teachers are pressured to "teach to the test"—has been documented across educational systems worldwide.

The COVID-19 pandemic accelerated the reassessment by creating a natural experiment. When testing requirements were temporarily suspended for university admissions, institutions were forced to rely on other indicators—grades, essays, recommendations, portfolios. Subsequent analysis found that admissions decisions made without test scores were not significantly less predictive of student success than those made with them.

Alternative assessment models are proliferating. Performance-based assessment, in which students demonstrate competencies through projects, presentations, and portfolios rather than timed examinations, has gained significant traction. The Mastery Transcript Consortium, a network of over 300 schools, has developed a digital transcript that replaces traditional grades with evidence of specific skills and competencies.

Technology is enabling new forms of assessment that were previously impractical. Adaptive testing platforms can adjust question difficulty in real time based on student responses, providing more precise measurements of ability while reducing testing time. Simulation-based assessments can evaluate complex skills—collaboration, problem-solving, ethical reasoning—that traditional multiple-choice tests cannot capture.

The movement is not without its critics. Defenders of standardized testing argue that it provides the only objective, comparable metric in an otherwise subjective landscape, particularly important for identifying talented students from disadvantaged backgrounds who might otherwise be overlooked. There are also legitimate concerns that alternative assessment methods, while educationally superior, may be more susceptible to bias and harder to implement at scale.

The emerging consensus among assessment experts is not that testing should be eliminated but that it should be reimagined as one component within a broader, more balanced system of evidence about student learning—a shift from measurement as an end in itself to assessment in service of learning.`, keywords:["assessment","holistic","curriculum","equity","indicator","competency","simulation","metric","consensus","component"] }

function renderNews() {
  const catBar = document.getElementById('newsCatBar');
  const categories = [...new Set(NEWS.map(a => a.cat))];
  catBar.innerHTML = `<button class="news-source-btn active" data-cat="all">全部 (${NEWS.length})</button>` +
    categories.map(c => `<button class="news-source-btn" data-cat="${c}">${c} (${NEWS.filter(a=>a.cat===c).length})</button>`).join('');

  catBar.querySelectorAll('.news-source-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      catBar.querySelectorAll('.news-source-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      renderNewsList(this.dataset.cat);
    });
  });

  renderNewsList('all');
}

function renderNewsList(cat) {
  const list = cat === 'all' ? NEWS : NEWS.filter(a => a.cat === cat);
  window._newsCache = list;
  document.getElementById('newsContent').innerHTML = list.map((a, i) => `
    <div class="news-card" onclick="showNewsDetail(${i})">
      <span class="news-source">${a.source}</span>
      <span style="padding:2px 8px;background:var(--c-tag-bg);border-radius:4px;font-size:.7rem;color:var(--c-accent);margin-right:8px">${a.cat}</span>
      <span class="news-meta">${a.date}</span>
      <div class="news-title">${escapeHtml(a.title)}</div>
      <div class="news-desc">${escapeHtml(a.desc.substring(0, 180))}...</div>
    </div>
  `).join('');
}

function showNewsDetail(idx) {
  const item = window._newsCache ? window._newsCache[idx] : null;
  if (!item) return;
  const paragraphs = item.desc.split('\n\n').filter(p => p.trim());
  document.getElementById('readContent').innerHTML = `
    <div class="dict-word" style="font-size:1.4rem;margin-bottom:4px">${escapeHtml(item.title)}</div>
    <p style="color:var(--c-dim);font-size:.8rem;margin-bottom:16px">${item.source} · ${item.date} · ${item.cat}</p>
    <div style="color:var(--c-text2);line-height:2;font-size:.95rem">
      ${paragraphs.length > 1
        ? paragraphs.map(p => `<p style="margin-bottom:16px;text-align:justify">${escapeHtml(p.trim())}</p>`).join('')
        : `<p style="text-align:justify">${escapeHtml(item.desc)}</p>`}
    </div>
    ${item.keywords ? `<div style="background:var(--c-bg-deep);padding:16px;border-radius:8px;margin-top:20px">
      <p style="color:var(--c-green);font-weight:600;margin-bottom:8px">核心关键词：</p>
      <div class="dict-syn">${item.keywords.map(k => `<span onclick="lookupWord('${k}')">${k}</span>`).join('')}</div>
    </div>` : ''}
    <button class="btn btn-gray" style="margin-top:16px" onclick="closeReader()">关闭</button>
  `;
  document.getElementById('readOverlay').classList.add('show');
}

function closeReader() {
  document.getElementById('readOverlay').classList.remove('show');
}

function escapeHtml(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  { title:"Passage 1 — The Rise of Remote Work", text:`The COVID-19 pandemic fundamentally altered the global work landscape, accelerating a shift toward <span class="highlight">remote</span> work that had been gradually gaining <span class="highlight">momentum</span> for years. Prior to 2020, approximately 5% of the American workforce operated from home on a full-time basis. By mid-2021, that figure had surged to nearly 40%, and while it has since stabilized, it remains substantially higher than pre-pandemic levels.<br><br>This transformation has brought both opportunities and challenges. On the positive side, many employees report improved work-life balance, <span class="highlight">eliminating</span> lengthy commutes and allowing for more <span class="highlight">flexible</span> schedules. Companies have <span class="highlight">benefited from</span> reduced office overhead and the ability to recruit talent from a broader <span class="highlight">geographic</span> pool. Productivity metrics, <span class="highlight">contrary to</span> early <span class="highlight">skepticism</span>, have generally held steady or even improved in many sectors.<br><br>However, significant <span class="highlight">drawbacks</span> have emerged. The <span class="highlight">blurring</span> of boundaries between work and personal life has led to increased burnout for some. <span class="highlight">Furthermore</span>, the loss of spontaneous face-to-face interaction has <span class="highlight">undermined</span> <span class="highlight">mentorship</span> opportunities and <span class="highlight">impeded</span> the organic exchange of ideas that often <span class="highlight">drives</span> <span class="highlight">innovation</span>. Junior employees, <span class="highlight">in particular</span>, have found it harder to learn from senior colleagues and <span class="highlight">establish</span> professional networks.`, questions:[{q:"What was the approximate percentage of American workers working from home full-time before 2020?",opts:["A) About 5%","B) About 20%","C) About 40%","D) About 50%"],ans:0},{q:"According to the passage, which is a benefit of remote work for companies?",opts:["A) Increased office overhead","B) Reduced office overhead","C) More face-to-face interaction","D) Fewer talented employees"],ans:1},{q:"The word 'skepticism' in the passage is closest in meaning to ____.",opts:["A) enthusiasm","B) confidence","C) doubt","D) optimism"],ans:2},{q:"Which group is mentioned as particularly disadvantaged by remote work?",opts:["A) Senior managers","B) IT professionals","C) Junior employees","D) Freelancers"],ans:2},{q:"What is the author's overall attitude toward remote work?",opts:["A) Entirely negative","B) Balanced, acknowledging pros and cons","C) Entirely positive","D) Indifferent"],ans:1}] },
  { title:"Passage 2 — The Environmental Cost of Fast Fashion", text:`The fashion industry ranks among the world's most environmentally damaging sectors, responsible for approximately 10% of global carbon emissions and nearly 20% of <span class="highlight">industrial</span> water pollution. The rise of 'fast fashion'—a business model characterized by rapid production cycles and low-cost garments designed for short-term use—has dramatically <span class="highlight">exacerbated</span> these environmental impacts.<br><br>A single cotton t-shirt requires an estimated 2,700 liters of water to produce, <span class="highlight">equivalent to</span> what an <span class="highlight">average</span> person drinks in two and a half years. Synthetic fibers like polyester, which now <span class="highlight">account for</span> over 60% of global clothing production, shed <span class="highlight">microplastics</span> with every wash. These particles eventually make their way into oceans, where they enter the food chain with <span class="highlight">potentially</span> devastating <span class="highlight">consequences</span> for marine life and, <span class="highlight">ultimately</span>, human health.<br><br>The social <span class="highlight">dimension</span> is equally troubling. Garment workers in developing countries often <span class="highlight">endure</span> unsafe conditions and <span class="highlight">inadequate</span> wages. The 2013 Rana Plaza collapse in Bangladesh, which killed over 1,100 workers, brought global <span class="highlight">attention</span> to these issues but <span class="highlight">meaningful</span> reform has been slow.<br><br><span class="highlight">Nevertheless</span>, there are signs of change. A growing number of <span class="highlight">consumers</span> are <span class="highlight">embracing</span> 'slow fashion,' <span class="highlight">prioritizing</span> quality, durability, and <span class="highlight">ethical</span> production. Some major brands have launched recycling programs and committed to using <span class="highlight">sustainable</span> materials, though critics <span class="highlight">argue</span> these efforts remain <span class="highlight">insufficient</span> <span class="highlight">in the face of</span> the industry's sheer scale.`, questions:[{q:"According to the passage, approximately what percentage of global carbon emissions comes from the fashion industry?",opts:["A) 5%","B) 10%","C) 20%","D) 30%"],ans:1},{q:"How much water does a single cotton t-shirt require to produce?",opts:["A) 270 liters","B) 1,200 liters","C) 2,700 liters","D) 5,400 liters"],ans:2},{q:"What environmental problem do synthetic fibers cause?",opts:["A) They release toxic gases","B) They shed microplastics when washed","C) They deplete the ozone layer","D) They cause acid rain"],ans:1},{q:"What event is mentioned as drawing global attention to garment worker conditions?",opts:["A) The Paris Agreement","B) The Rana Plaza collapse","C) The Kyoto Protocol","D) The UN Climate Summit"],ans:1},{q:"What is the main purpose of the passage?",opts:["A) To promote fast fashion brands","B) To describe the history of fashion","C) To highlight the environmental and social costs of fast fashion","D) To argue against clothing recycling"],ans:2}] },
  { title:"Passage 3 — The Future of Artificial Intelligence in Education", text:`Artificial intelligence is <span class="highlight">poised to</span> <span class="highlight">transform</span> education in ways that were once the <span class="highlight">province</span> of science fiction. From <span class="highlight">adaptive</span> learning platforms that tailor <span class="highlight">curriculum</span> to <span class="highlight">individual</span> student needs, to automated grading systems that free teachers from hours of <span class="highlight">routine</span> work, AI is already making inroads into classrooms around the world.<br><br>The most promising applications of educational AI <span class="highlight">involve</span> personalization. Traditional classrooms, by <span class="highlight">necessity</span>, teach to the <span class="highlight">average</span> student—leaving some learners bored and others struggling to keep up. AI-powered systems can <span class="highlight">assess</span> a student's strengths, weaknesses, and learning style in real time, then <span class="highlight">adjust</span> the difficulty, format, and pacing of material <span class="highlight">accordingly</span>. This <span class="highlight">approach</span> has shown <span class="highlight">remarkable</span> results in early trials, particularly in subjects like mathematics and language learning.<br><br>However, the integration of AI into education raises profound questions. There are legitimate concerns about data <span class="highlight">privacy</span>, as these systems collect <span class="highlight">enormous</span> amounts of <span class="highlight">sensitive</span> information about children. The <span class="highlight">potential</span> for <span class="highlight">bias</span> in AI algorithms—which may <span class="highlight">perpetuate</span> existing <span class="highlight">inequalities</span>—is another serious worry. Most fundamentally, education is not merely about the <span class="highlight">transmission</span> of knowledge but about nurturing <span class="highlight">critical thinking</span>, creativity, and emotional <span class="highlight">intelligence</span>—qualities that remain <span class="highlight">distinctively</span> human and may prove <span class="highlight">resistant</span> to <span class="highlight">automation</span>.<br><br>The <span class="highlight">consensus</span> among experts is that AI should serve as a tool to <span class="highlight">augment</span> rather than replace teachers. The most effective models combine AI-driven <span class="highlight">instruction</span> with human <span class="highlight">mentorship</span>, <span class="highlight">harnessing</span> the <span class="highlight">strengths</span> of both.`, questions:[{q:"What is the most promising application of AI in education according to the passage?",opts:["A) Automated grading","B) Personalization of learning","C) Reducing teacher salaries","D) Eliminating homework"],ans:1},{q:"Which concern about educational AI is NOT mentioned in the passage?",opts:["A) Data privacy","B) Algorithmic bias","C) Increased school fees","D) Loss of focus on critical thinking"],ans:2},{q:"What do experts believe AI's role in education should be?",opts:["A) To completely replace teachers","B) To augment rather than replace teachers","C) To eliminate all human interaction","D) To reduce education costs only"],ans:1},{q:"The word 'augment' in the last paragraph is closest in meaning to ____.",opts:["A) replace","B) reduce","C) enhance","D) criticize"],ans:2},{q:"Which of the following best summarizes the passage?",opts:["A) AI will completely replace human teachers within a decade","B) AI offers significant benefits for personalized education but raises important concerns","C) AI has failed to deliver any meaningful improvements in education","D) Education should resist all forms of technological change"],ans:1}] },
  { title:"Passage 4 — The Double-Edged Sword of Globalization", text:`Globalization has been one of the most <span class="highlight">controversial</span> topics of the past half-century. Its <span class="highlight">proponents</span> argue that the <span class="highlight">integration</span> of national economies has lifted hundreds of millions out of poverty, facilitated the spread of technology and ideas, and fostered unprecedented levels of international cooperation. <span class="highlight">Critics</span>, however, point to widening <span class="highlight">inequality</span>, the erosion of local cultures, and the <span class="highlight">exploitation</span> of workers in developing countries.<br><br>The economic <span class="highlight">evidence</span> is mixed. In China and India, trade liberalization has <span class="highlight">coincided</span> with dramatic reductions in poverty and the emergence of a <span class="highlight">substantial</span> middle class. Yet in many Western countries, the same forces have been associated with the decline of manufacturing, stagnant wages for low-skilled workers, and growing <span class="highlight">resentment</span> toward the political <span class="highlight">establishment</span>.<br><br>Culturally, globalization has created what some scholars call a '<span class="highlight">paradox</span> of plenty.' While individuals now have <span class="highlight">access</span> to an <span class="highlight">unprecedented</span> <span class="highlight">diversity</span> of cultural products—from K-pop to Hollywood to Bollywood—there are legitimate fears that this abundance masks a <span class="highlight">homogenizing</span> <span class="highlight">tendency</span>, as global media <span class="highlight">giants</span> <span class="highlight">dominate</span> local markets.<br><br>The challenge for policymakers is to <span class="highlight">harness</span> the benefits of globalization while <span class="highlight">mitigating</span> its harmful effects. This requires <span class="highlight">robust</span> social safety nets, investment in education and retraining, and international agreements that ensure the gains from trade are more <span class="highlight">equitably</span> distributed.`, questions:[{q:"According to the passage, which country is mentioned as having experienced poverty reduction alongside trade liberalization?",opts:["A) The United States","B) Japan","C) China and India","D) Germany"],ans:2},{q:"What negative effect of globalization in Western countries does the passage mention?",opts:["A) Increased immigration","B) Decline of manufacturing","C) Higher education costs","D) Reduced international trade"],ans:1},{q:"The 'paradox of plenty' refers to ____.",opts:["A) too much food causing obesity","B) abundant cultural choices potentially leading to cultural homogenization","C) too many jobs but not enough workers","D) excess wealth causing corruption"],ans:1},{q:"What does the author suggest policymakers should do?",opts:["A) Stop globalization entirely","B) Ignore the negative effects","C) Harness benefits while mitigating harmful effects","D) Focus only on economic growth"],ans:2},{q:"The author's tone in this passage is best described as ____.",opts:["A) passionate and emotional","B) balanced and analytical","C) sarcastic and mocking","D) enthusiastic and promotional"],ans:1}] },
  { title:"Passage 5 — The Psychology of Habit Formation", text:`Understanding how habits form is crucial for anyone seeking to make lasting changes in their personal or professional life. <span class="highlight">According to</span> researchers at University College London, it takes an <span class="highlight">average</span> of 66 days for a new behavior to become <span class="highlight">automatic</span>, though the range varies widely <span class="highlight">depending on</span> the <span class="highlight">complexity</span> of the behavior and the individual.<br><br>The <span class="highlight">neurological</span> basis of habit formation lies in a process called 'chunking,' in which the brain <span class="highlight">converts</span> a <span class="highlight">sequence</span> of actions into an automatic routine. This is <span class="highlight">highly</span> <span class="highlight">efficient</span> from an <span class="highlight">evolutionary</span> <span class="highlight">perspective</span>, as it frees up mental resources for other tasks. However, the same <span class="highlight">mechanism</span> that makes good habits stick also makes bad habits <span class="highlight">notoriously</span> difficult to break.<br><br>Charles Duhigg, in his bestselling book "The Power of Habit," <span class="highlight">identifies</span> a three-step loop: cue, routine, and reward. The cue <span class="highlight">triggers</span> the brain to <span class="highlight">initiate</span> a behavior, the routine is the behavior itself, and the reward helps the brain determine whether this loop is worth remembering. Understanding this loop is the key to both building positive habits and <span class="highlight">dismantling</span> negative ones.<br><br>Recent research has also <span class="highlight">highlighted</span> the importance of <span class="highlight">environment</span> in habit formation. People who <span class="highlight">restructure</span> their surroundings to make desired behaviors eas // ═══════════════════ 工具 ═══════════════════
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

// ═══════════════════ 词典弹窗 ═══════════════════
const dictCache = {};

document.addEventListener('dblclick', function(e) {
  const selection = window.getSelection();
  const word = (selection.toString().trim() || e.target.textContent?.match(/\b[a-zA-Z]{3,}\b/)?.[0]) || '';
  if (word && word.length >= 3 && /^[a-zA-Z]+$/.test(word)) {
    lookupWord(word.toLowerCase());
  }
});

async function lookupWord(word) {
  const overlay = document.getElementById('dictOverlay');
  const content = document.getElementById('dictContent');
  overlay.classList.add('show');
  content.innerHTML = '<div class="dict-loading">查询中...<br><span style="font-size:.75rem;color:var(--c-faint)">正在连接词典服务</span></div>';

  if (dictCache[word]) { renderDictResult(word, dictCache[word]); return; }

  // 先查本地词汇表
  const local = WORDS.find(w => w.en.toLowerCase() === word.toLowerCase());

  // 尝试 Free Dictionary API（8秒超时）
  let apiData = null;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, { signal: ctrl.signal });
    clearTimeout(timer);
    if (resp.ok) { apiData = await resp.json(); dictCache[word] = apiData; }
  } catch(e) { /* 超时或网络错误，继续尝试备用API */ }

  // 备选API（不需要key的免费词典）
  if (!apiData) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      const resp = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=d&max=1`, { signal: ctrl.signal });
      clearTimeout(timer);
      if (resp.ok) {
        const dm = await resp.json();
        if (dm.length > 0 && dm[0].defs?.length) {
          apiData = [{ word: word, meanings: dm[0].defs.map(d => {
            const parts = d.split('\t');
            return { partOfSpeech: parts[0] || 'n.', definitions: [{ definition: parts.slice(1).join(' ') }] };
          }), source: 'datamuse' }];
          dictCache[word] = apiData;
        }
      }
    } catch(e) { /* 备用API也失败 */ }
  }

  if (apiData) {
    renderDictResult(word, apiData);
  } else if (local) {
    // API全部失败，显示本地数据
    content.innerHTML = `
      <div class="dict-word">${local.en}</div>
      <div class="dict-pos">${local.pos}</div>
      <div class="dict-def" style="margin-top:12px">${local.zh}</div>
      ${local.ex ? `<div class="dict-ex">${local.ex}</div>` : ''}
      <p style="color:var(--c-dim);font-size:.7rem;margin-top:12px">离线模式 — 本地词汇表数据</p>
      <button class="btn btn-gray" style="margin-top:8px" onclick="closeDict()">关闭</button>`;
  } else {
    content.innerHTML = `
      <div class="dict-word">${word}</div>
      <p style="color:var(--c-muted);margin-top:16px">词典服务暂时不可用，且该词不在本地词汇表中。</p>
      <p style="color:var(--c-dim);font-size:.75rem">建议：检查网络连接后重试</p>
      <button class="btn btn-blue" style="margin-top:12px" onclick="lookupWord('${word}')">重试</button>
      <button class="btn btn-gray" style="margin-left:8px" onclick="closeDict()">关闭</button>`;
  }
}

function renderDictResult(word, data) {
  const entry = data[0];
  const sourceLabel = entry.source === 'datamuse' ? 'Datamuse API' : 'Free Dictionary API';
  const phonetic = entry.phonetics?.find(p => p.text) || entry.phonetics?.[0] || {};
  const phoneticText = phonetic.text || '';
  const audioUrl = phonetic.audio || '';

  const meanings = entry.meanings?.map(m => `
    <div style="margin:12px 0">
      <span class="dict-pos">${m.partOfSpeech}</span>
      ${m.definitions.slice(0, 4).map(d => `
        <div class="dict-def">${d.definition}${d.example ? `<div class="dict-ex">"${d.example}"</div>` : ''}</div>
      `).join('')}
      ${m.synonyms?.length ? `<div class="dict-syn">同义词: ${m.synonyms.slice(0,8).map(s => `<span onclick="lookupWord('${s}')">${s}</span>`).join('')}</div>` : ''}
    </div>
  `).join('') || '<p style="color:var(--c-muted)">无详细释义</p>';

  // 同时查找本地词汇表补充信息
  const local = WORDS.find(w => w.en.toLowerCase() === word.toLowerCase());

  document.getElementById('dictContent').innerHTML = `
    <div class="dict-word">${entry.word || word}</div>
    <div class="dict-phonetic">
      ${phoneticText ? `<span>/${phoneticText}/</span>` : ''}
      ${audioUrl ? `<button onclick="new Audio('${audioUrl}').play()" title="发音">🔊</button>` : ''}
    </div>
    ${meanings}
    ${local ? `<div style="margin-top:16px;padding:12px;background:var(--c-bg-deep);border-radius:8px">
      <p style="color:var(--c-accent);font-size:.75rem;font-weight:600;margin-bottom:4px">CET-6 学习要点</p>
      <p style="color:var(--c-green)">释义：${local.zh}</p>
      ${local.ex ? `<p style="color:var(--c-muted)">例句：${local.ex}</p>` : ''}
    </div>` : ''}
    <p style="color:var(--c-faint);font-size:.7rem;margin-top:16px">来源: ${sourceLabel} | 双击页面任意英文单词即可查词</p>
    <button class="btn btn-gray" style="margin-top:8px" onclick="closeDict()">关闭</button>
  `;
}

function closeDict() {
  document.getElementById('dictOverlay').classList.remove('show');
}

// 键盘快捷键: ESC关闭词典/阅读器
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('dictOverlay').classList.contains('show')) closeDict();
    if (document.getElementById('readOverlay').classList.contains('show')) closeReader();
  }
});

// 抽认卡键盘
document.addEventListener('keydown', e => {
  if (document.getElementById('dictOverlay').classList.contains('show')) return;
  const v = document.querySelector('.view.active');
  if (v && v.id === 'flashcard') {
    if (e.key === 'ArrowRight') nextCard();
    else if (e.key === 'ArrowLeft') prevCard();
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
    else if (e.key === 'r') randomCard();
  }
});

// ═══════════════════ 主题切换 ═══════════════════
const THEME_KEY = 'cet6_theme';
function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeToggle').innerHTML = '🌙';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeToggle').innerHTML = '☀️';
  }
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

// ═══════════════════ PWA 注册 ═══════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('SW registered');
      // 监听更新消息
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data?.type === 'update-available') {
          document.getElementById('updateBanner')?.classList.add('show');
        }
      });
    }).catch(() => {});
  });
}

// ═══════════════════ 远程内容同步 ═══════════════════
const REMOTE_API = localStorage.getItem('cet6_api_url') || '';

async function syncRemoteContent() {
  if (!REMOTE_API) return;
  try {
    const resp = await fetch(REMOTE_API + '/content-version.json', { cache: 'no-cache' });
    if (!resp.ok) return;
    const meta = await resp.json();
    const localVer = localStorage.getItem('cet6_content_version');
    if (meta.version === localVer) return;

    // 拉取远程词汇
    if (meta.files?.words) {
      const wResp = await fetch(REMOTE_API + '/' + meta.files.words);
      if (wResp.ok) {
        const remoteWords = await wResp.json();
        localStorage.setItem('cet6_remote_words', JSON.stringify(remoteWords));
        mergeRemoteWords(remoteWords);
      }
    }
    // 拉取远程文章
    if (meta.files?.articles) {
      const aResp = await fetch(REMOTE_API + '/' + meta.files.articles);
      if (aResp.ok) {
        const remoteArticles = await aResp.json();
        localStorage.setItem('cet6_remote_articles', JSON.stringify(remoteArticles));
        updateNewsArticles(remoteArticles);
      }
    }
    localStorage.setItem('cet6_content_version', meta.version);
  } catch(e) {}
}

function mergeRemoteWords(remoteWords) {
  remoteWords.forEach(rw => {
    const exists = WORDS.find(w => w.en === rw.en);
    if (!exists) {
      rw.id = WORDS.length + 1;
      WORDS.push(rw);
    }
  });
  updateStats(); renderWordList();
}

function updateNewsArticles(articles) {
  const merged = [...articles, ...NEWS];
  // 去重
  const seen = new Set();
  window._remoteNews = merged.filter(a => {
    const key = a.title;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// 启动时自动同步
syncRemoteContent();

// ═══════════════════ 初始化 ═══════════════════
updateStats(); showCard(); renderWordList(); renderPhraseList(); renderNews(); renderReading(); renderCloze(); renderBankedCloze(); renderTranslation(); renderWriting();
</script>
